<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3c7a4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bergerie">
<link rel="manifest" href="manifest.webmanifest">
<title>Ma bergerie — Lots & rations</title>
<style>
  :root{--vert:#3c7a4e;--vertf:#eaf2ec;--creme:#fbf8f1;--orange:#e3812f;--danger:#d1584f;--encre:#26221e;--muet:#8a8175;--ligne:#e6dfd0;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--creme);color:var(--encre);display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent}
  header{background:var(--vert);color:#fff;flex-shrink:0}
  .hrow{display:flex;align-items:center;gap:10px;padding:8px 14px}
  .brand{line-height:1.18;flex:1;min-width:0}
  .brand b{font-size:16px;font-weight:700;letter-spacing:.2px;display:block;white-space:nowrap}
  .brand span{font-size:10.5px;opacity:.75;letter-spacing:.8px;text-transform:uppercase;display:block}
  button{font:inherit;border:none;border-radius:10px;cursor:pointer;background:none;padding:8px 12px;color:inherit}
  .btnw{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);width:38px;height:38px;display:flex;align-items:center;justify-content:center;padding:0}
  .btnw:active{background:rgba(255,255,255,.3)}
  .btnw.warn{background:var(--danger);border-color:var(--danger)}
  #main{flex:1;display:flex;flex-direction:column;min-height:0}
  #mapWrap{flex:1;position:relative;min-height:0;background:#efe9dc}
  #map{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .zooms{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
  .zooms button{width:38px;height:38px;background:#fff;border:1px solid var(--ligne);color:var(--encre);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 4px rgba(38,34,30,.12)}
  #side{flex-shrink:0;display:flex;flex-direction:column;background:#fff;border-top:1px solid var(--ligne)}
  #tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 2px;background:#fff;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  .tab{display:flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;border:1.5px solid var(--ligne);background:#faf7f0;color:#4a443d;font-weight:600;font-size:13.5px;white-space:nowrap;flex-shrink:0}
  .tab.on{border-color:var(--vert);background:var(--vertf);color:var(--vert)}
  .tab svg{flex-shrink:0}
  .tab .dot{width:11px;height:11px;border-radius:4px;flex-shrink:0}
  .cbar{display:flex;justify-content:center;flex-shrink:0;padding:2px 0 3px}
  .cbar button{display:flex;align-items:center;gap:6px;color:var(--muet);font-size:12px;font-weight:600;letter-spacing:.4px;padding:5px 14px;border-radius:999px}
  .cbar button:active{background:#f3eee3}
  #panel{padding:2px 14px 16px;max-height:42dvh;overflow:auto;flex-shrink:0}
  #side.min #panel{display:none}
  .ph{font-weight:700;color:var(--vert);display:flex;align-items:center;gap:8px;margin:6px 0 4px;flex-wrap:wrap;font-size:15px}
  .dot{width:13px;height:13px;border-radius:4px;display:inline-block;flex-shrink:0}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muet);min-width:82px}
  .vv{font-size:14px;color:#4a4440;line-height:1.4}
  .big{font-size:16px;font-weight:700}
  button.step{width:42px;height:42px;background:#faf7f0;border:1px solid var(--ligne);color:var(--encre);font-size:20px;padding:0}
  button.act{background:var(--vert);color:#fff}
  button.warn{background:var(--danger);color:#fff}
  .closep{margin-left:auto;background:#f3eee3;color:#5a5248;padding:6px 9px;border-radius:9px;display:flex;align-items:center}
  .btnsm{background:#f3eee3;color:#4a443d;padding:5px 10px;border-radius:9px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
  .btnsm.danger{background:#fdeceb;color:#a33b32}
  input{font:inherit;border:1px solid var(--ligne);border-radius:10px;padding:9px 8px;background:#fff;color:var(--encre);font-size:16px;text-align:center}
  input.short{width:76px}
  .hint{font-size:12.5px;color:var(--muet);margin-top:8px;line-height:1.45}
  .sep{border-top:1px solid var(--ligne);margin:10px 0}
  .chip{border-radius:999px;padding:7px 13px;border:2px solid transparent;font-weight:600;background:#f3eee3;color:var(--encre);font-size:13.5px}
  .chip.on{border-color:var(--encre)}
  .fcard{border-radius:12px;padding:8px 12px;margin:8px 0;background:#fff;border:1px solid var(--ligne)}
  .fc-top{display:flex;align-items:center;gap:7px}
  .fc-name{font-weight:600;flex:1}
  .fc-bar{height:8px;border-radius:4px;background:#f0ebdd;margin:6px 0 4px;overflow:hidden}
  .fc-fill{height:100%;border-radius:4px}
  .fc-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0;font-size:15px}
  .tot b{font-size:18px}
  .mini{font-size:12px;border-radius:8px;padding:2px 7px;margin:1px;display:inline-flex;align-items:center;gap:5px}
  .mini .dot{width:9px;height:9px}
  .lotsList .lrow{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--ligne);cursor:pointer;flex-wrap:wrap}
  .lotsList .lrow:active{background:#faf7f0}
  .lrow .nm{font-weight:700}
  .su{font-size:12px;color:#7a7267;border:1px solid var(--ligne);border-radius:7px;padding:2px 7px;margin:1px;display:inline-block;background:#faf7f0}
  .trow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #f3eee3;flex-wrap:wrap}
  .notice{background:#f3eee3;border:1px solid var(--ligne);border-radius:10px;padding:7px 11px;font-size:13px;margin:6px 0;display:flex;gap:8px;align-items:flex-start;color:#4a443d}
  .notice svg{flex-shrink:0;margin-top:1px}
  .notice.ko{background:#fdeceb;color:#a33b32;border-color:#f2cdc9}
  @media(min-width:920px){
    #main{flex-direction:row}
    #side{width:430px;border-top:none;border-left:1px solid var(--ligne)}
    #panel{max-height:none;flex:1;min-height:0}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><b>Ma bergerie</b><span>Lots &amp; rations</span></div>
    <button class="btnw" id="btnReset" title="Tout remettre à zéro"></button>
  </div>
</header>
<main id="main">
  <div id="mapWrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="zooms">
      <button id="zin" title="Zoomer"></button>
      <button id="zout" title="Dézoomer"></button>
      <button id="zfit" title="Vue complète"></button>
    </div>
  </div>
  <div id="side">
    <nav id="tabs"></nav>
    <div class="cbar"><button id="pcol" title="Afficher ou masquer les détails"></button></div>
    <section id="panel"></section>
  </div>
</main>
<script>
'use strict';
/* ============ BERGERIE — valeurs ajustables ============
   35 m × 22 m — 3 places au mètre
   Aires : toute la longueur (35 m). Seuls les tapis sont plus courts :
   Tapis doubles : 92 places/côté (~30,67 m) — Tapis simple : 102 places (34 m)
   Bandes : Aire 1 / Tapis 1 / Aire 2 / Tapis 2 / Aire 3 / Tapis 3 / Aire 4 / Tapis simple / couloir */
var L=35, W=22, PL_M=3, DBL_PL=92, TS_PL=102;
var DBL_X0=0, DBL_LEN=DBL_PL/PL_M, DBL_END=DBL_X0+DBL_LEN;   /* doubles : 0 → 30,67 m */
var TS_X0=0, TS_LEN=TS_PL/PL_M, TS_END=TS_X0+TS_LEN;         /* simple : 0 → 34 m */
var AIRES=[
  {y:0.0,  h:4.3,lab:'Aire 1'},
  {y:5.0,  h:4.3,lab:'Aire 2'},
  {y:10.0, h:4.3,lab:'Aire 3'},
  {y:15.0, h:4.3,lab:'Aire 4'}
];
var TAPIS=[
  {y:4.3,  h:0.7,x1:DBL_END,lab:'Tapis double 1'},
  {y:9.3,  h:0.7,x1:DBL_END,lab:'Tapis double 2'},
  {y:14.3, h:0.7,x1:DBL_END,lab:'Tapis double 3'},
  {y:19.3, h:0.7,x1:TS_END, lab:'Tapis simple'}
];
var LOT_COLS=['#a8d5b0','#f5cfa0','#a9cbe8','#f2b8cf','#e8e0a0','#c9b8e8','#9fd9c8','#f0b9a0'];
var FEED_COLS=['#6a994e','#d9a441','#7b6cbf','#4d8fd1','#c96a5b','#3ba99c','#b5853f','#8a8f5a'];

/* ============ icônes ============ */
var ICONS={
  plan:'<rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9.5h18M9.5 3v18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  hopper:'<path d="M4.5 4.5h15l-5.5 7v4.5l-4 3v-7.5z"/>',
  chevU:'<path d="M6 14l6-6 6 6"/>',
  chevD:'<path d="M6 10l6 6 6-6"/>',
  reset:'<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/>',
  zin:'<circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.4-4.4M11 8v6M8 11h6"/>',
  zout:'<circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.4-4.4M8 11h6"/>',
  fit:'<path d="M8.5 3.5h-5v5M15.5 3.5h5v5M8.5 20.5h-5v-5M15.5 20.5h5v-5"/>',
  pen:'<path d="M13.5 20.5h7"/><path d="M16.4 3.9a2 2 0 0 1 2.8 2.8L7.5 18.4l-3.9 1 1-3.9z"/>',
  trash:'<path d="M3.5 6.5h17M8.5 6.5v-2h7v2M18.5 6.5l-1 14h-11l-1-14M10 11v5.5M14 11v5.5"/>',
  warn:'<path d="M12 3.5L2.5 19.5a1.5 1.5 0 0 0 1.3 2.3h16.4a1.5 1.5 0 0 0 1.3-2.3L12 3.5z"/><path d="M12 10v4M12 17.5h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11.5V16"/>',
  check:'<path d="M20 6.5L9.5 17.5 4 12"/>',
  close:'<path d="M17.5 6.5l-11 11M6.5 6.5l11 11"/>',
  dl:'<path d="M12 3.5v11M7.5 10.5L12 15l4.5-4.5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  ul:'<path d="M12 15.5v-11M7.5 8.5L12 4l4.5 4.5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>'
};
function ic(n,s){return '<svg viewBox="0 0 24 24" width="'+(s||13)+'" height="'+(s||13)+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';}

/* ============ état ============ */
var KEY='bergerie_lots_v5',KEYOLD='bergerie_lots_v3';
function defaultState(){
  return {nextLot:1,nextFeed:1,
    feeds:[{id:0,name:'Aliment'}],
    lots:[{id:0,b:0,r:{},name:null}],
    airs:[0,1,2,3].map(function(){return {barriers:[],lots:[0]};})};
}
function loadS(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lots&&s.airs&&s.feeds)return s;}catch(e){}
  try{
    var o=JSON.parse(localStorage.getItem(KEYOLD));
    if(o&&o.lots&&o.airs&&o.feeds){ /* v4 (kg/place) -> v5 (kg/brebis) */
      state=o;
      o.lots.forEach(function(l){
        var nr={},P=lotStats(l.id).P;
        for(var fid in (l.rt||{})){var v=+l.rt[fid]||0;nr[fid]=(l.b>0&&P>0)?P*v/l.b:v;}
        l.r=nr;delete l.rt;
      });
      save();return o;
    }
  }catch(e){}
  return null;
}
var storageKo=false;
function save(){
  try{var s=JSON.stringify(state);localStorage.setItem(KEY,s);storageKo=(localStorage.getItem(KEY)!==s);}
  catch(e){storageKo=true;}
}
var state=loadS()||defaultState();
var sel=null,showTrie=false,editName=null,editFeed=null,arm=null,notice='',panelMin=false;

/* ============ géométrie ============ */
function xOfK(k){return DBL_X0+DBL_LEN*k/DBL_PL;}
function cumT(k){return Math.round(TS_PL*xOfK(k)/TS_LEN);}
function ksOf(i){return [0].concat(state.airs[i].barriers,[DBL_PL]);}
function tsOf(k1,k2,isLast){return (isLast?TS_PL:cumT(k2))-cumT(k1);}
function segsOf(i){
  var ks=ksOf(i),o=[];
  for(var j=0;j<ks.length-1;j++){
    var k1=ks[j],k2=ks[j+1],isLast=j===ks.length-2,ts=(i===3)?tsOf(k1,k2,isLast):0;
    var n=k2-k1;
    o.push({j:j,k1:k1,k2:k2,isLast:isLast,lot:state.airs[i].lots[j],ts:ts,
      pl:i===0?n:(i===1||i===2?2*n:n+ts)});
  }
  return o;
}
function lotById(id){for(var x=0;x<state.lots.length;x++)if(state.lots[x].id===id)return state.lots[x];return null;}
function lotCol(id){return LOT_COLS[id%LOT_COLS.length];}
function colFeed(id){return FEED_COLS[id%FEED_COLS.length];}
function lotName(l){return l?(l.name?l.name:'Lot '+(l.id+1)):'—';}
function lotShort(l){return l?(l.name?l.name.slice(0,14):'L'+(l.id+1)):'—';}
function lotStats(id){
  var t=[0,0,0,0],segs=[];
  for(var i=0;i<4;i++)segsOf(i).forEach(function(sg){
    if(sg.lot!==id)return;
    var n=sg.k2-sg.k1;
    if(i===0)t[0]+=n; else if(i===1){t[0]+=n;t[1]+=n;} else if(i===2){t[1]+=n;t[2]+=n;} else {t[2]+=n;t[3]+=sg.ts;}
    segs.push({air:i+1,k1:sg.k1,k2:sg.k2,pl:sg.pl});
  });
  return {t:t,P:t[0]+t[1]+t[2]+t[3],segs:segs};
}
function feedVal(l,fid){return (l.r&&l.r[fid])||0;}   /* kg par brebis */
function setFeedVal(l,fid,v){l.r=l.r||{};l.r[fid]=v;}
function sumRations(l){var s=0;if(!l)return 0;state.feeds.forEach(function(f){s+=feedVal(l,f.id);});return s;}
function lotTot(l,fid){return (l.b||0)*feedVal(l,fid);}
function perPlace(l,fid){if(!l||!(l.b>0))return 0;var st=lotStats(l.id);if(st.P<=0)return 0;return l.b*feedVal(l,fid)/st.P;}
function lotAt(i,k){
  var ks=ksOf(i),ls=state.airs[i].lots;
  for(var j=0;j<ks.length-1;j++)if(k>=ks[j]&&k<ks[j+1])return ls[j];
  return ls[ls.length-1];
}
function dblRanges(t){ /* tapis t entre aires t et t+1 : bornes = union des barrières ; doses par aliment */
  var bs=state.airs[t].barriers.concat(state.airs[t+1].barriers).filter(function(k){return k>0&&k<DBL_PL;});
  bs=bs.filter(function(v,ix){return bs.indexOf(v)===ix;}).sort(function(a,b){return a-b;});
  var ks=[0].concat(bs,[DBL_PL]),out=[];
  for(var j=0;j<ks.length-1;j++){
    var k1=ks[j],k2=ks[j+1];if(k2<=k1)continue;
    var la=lotAt(t,k1),lb=lotAt(t+1,k1),doses={},tot=0;
    state.feeds.forEach(function(f){var d=perPlace(lotById(la),f.id)+perPlace(lotById(lb),f.id);doses[f.id]=d;tot+=d;});
    out.push({k1:k1,k2:k2,a:la,b:lb,doses:doses,tot:tot});
  }
  return out;
}
function tsRanges(){
  var out=[];
  segsOf(3).forEach(function(sg){
    var c1=cumT(sg.k1),c2=sg.isLast?TS_PL:cumT(sg.k2);
    if(c2<=c1)return;
    var doses={},tot=0;
    state.feeds.forEach(function(f){var d=perPlace(lotById(sg.lot),f.id);doses[f.id]=d;tot+=d;});
    out.push({k1:c1,k2:c2,a:sg.lot,b:null,doses:doses,tot:tot});
  });
  return out;
}
function trieHtml(){
  var head='<div class="ph">Trémies — réglage par place<button class="closep" id="pCloseTrie">'+ic('close',12)+'</button></div>';
  if(!state.feeds.length)return head+'<div class="vv">Aucun aliment : ajoute-en depuis l’onglet Bergerie.</div>';
  var names=['Tapis double 1','Tapis double 2','Tapis double 3','Tapis simple'];
  var cards='',grand=0;
  for(var t=0;t<4;t++){
    var rs=(t<3?dblRanges(t):tsRanges()).filter(function(r){return r.tot>0;});
    var tot=0;rs.forEach(function(r){tot+=(r.k2-r.k1)*r.tot;});
    grand+=tot;
    var lines='';
    rs.forEach(function(r){
      var same=r.b!=null&&r.b===r.a;
      var who=lotShort(lotById(r.a))+((r.b==null)?'':(same?' des 2 côtés':' + '+lotShort(lotById(r.b))+' · ration commune'));
      var dots='<span class="dot" style="background:'+lotCol(r.a)+'"></span>'+((r.b==null)?'':'<span class="dot" style="background:'+lotCol(r.b)+'"></span>');
      var fed=state.feeds.filter(function(f){return (r.doses[f.id]||0)>0.0005;});
      function feedLine(f,compact){
        var pa=Math.round(perPlace(lotById(r.a),f.id)*1000);
        var nm='<span class="dot" style="background:'+colFeed(f.id)+'"></span>'+esc(f.name);
        var split='';
        if(same){split='<span class="su">2 × '+pa+' g</span>';}
        else if(r.b!=null){
          var pb=Math.round(perPlace(lotById(r.b),f.id)*1000);
          var parts=[];
          if(pa>0.5)parts.push(esc(lotShort(lotById(r.a)))+' '+pa);
          if(pb>0.5)parts.push(esc(lotShort(lotById(r.b)))+' '+pb);
          if(parts.length)split='<span class="su">'+parts.join(' + ')+' g</span>';
        }
        if(compact)return '<div class="trow">'+dots+'<span class="vv" style="flex:1">places <b>'+(r.k1+1)+'–'+r.k2+'</b> <span class="su">'+esc(who)+'</span> '+nm+'</span>'+split+'<b>'+Math.round(r.doses[f.id]*1000)+' g/place</b></div>';
        return '<div class="trow" style="padding-left:22px"><span class="vv" style="flex:1">'+nm+'</span>'+split+'<b>'+Math.round(r.doses[f.id]*1000)+' g/place</b></div>';
      }
      lines+=(fed.length===1)?feedLine(fed[0],true):('<div class="trow">'+dots+'<span class="vv" style="flex:1">places <b>'+(r.k1+1)+'–'+r.k2+'</b> <span class="su">'+esc(who)+'</span></span></div>'+fed.map(function(f){return feedLine(f,false);}).join(''));
    });
    cards+='<div class="fcard"><div class="fc-top"><span class="fc-name">'+names[t]+'</span><span class="su">total '+fmt(tot,1)+' kg</span></div>'+((lines)||'<div class="vv">rien à verser</div>')+'</div>';
  }
  var ctrl='';
  state.lots.forEach(function(l){
    if(!(l.b>0))return;
    var kg=0,pl=0;
    for(var tC=0;tC<4;tC++){
      var rsC=(tC<3?dblRanges(tC):tsRanges());
      rsC.forEach(function(r){
        var n=r.k2-r.k1,sides=(r.a===l.id?1:0)+((r.b!=null&&r.b===l.id)?1:0);
        if(!sides)return;
        state.feeds.forEach(function(f){kg+=n*sides*perPlace(l,f.id);});
        pl+=n*sides;
      });
    }
    if(pl<=0)return;
    ctrl+='<div class="trow"><span class="dot" style="background:'+lotCol(l.id)+'"></span><span class="vv" style="flex:1">'+esc(lotShort(l))+' · <b>'+fmt(kg)+' kg</b> sur ses '+pl+' places</span><span class="vv">÷ '+l.b+' têtes = <b>'+Math.round(kg/l.b*1000)+' g/j</b> '+ic('check',11)+'</span></div>';
  });
  return head+cards+
    '<div class="tot">À verser au total <b>'+fmt(grand)+' kg</b></div>'+
    ((ctrl)?'<div class="ph">'+ic('check',14)+' Contrôle par lot</div>'+ctrl:'')+
    '<div class="hint">Places numérotées depuis la gauche. La trémie verse au milieu du tapis : une seule ration pour les 2 rangées — « 2 × » la part du lot quand il est seul, somme des parts des 2 lots quand ils se partagent le tapis. Contrôle par lot : total versé ÷ effectif = sa ration g/j.</div>';
}
function fmt(n,d){if(d==null)d=2;return (+(n.toFixed(d))).toFixed(d).replace('.',',');}
function pnum(v){var x=parseFloat(String(v).replace(',','.'));return isNaN(x)?0:x;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ============ sauvegarde fichier (export / import) ============ */
function exportData(){
  try{
    var data=JSON.stringify({app:'bergerie-lots',v:5,date:new Date().toISOString(),state:state});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download='bergerie-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
    notice='Sauvegarde téléchargée — garde-la précieusement.';
  }catch(e){notice='Export impossible sur ce navigateur.';}
  save();renderPanel();
}
function importJson(text){
  try{
    var o=JSON.parse(text);
    var s=(o&&o.state&&o.state.lots&&o.state.airs&&o.state.feeds)?o.state:((o&&o.lots&&o.airs&&o.feeds)?o:null);
    if(!s||!Array.isArray(s.lots)||!Array.isArray(s.feeds)||!Array.isArray(s.airs)||s.airs.length!==4)return {ok:false,msg:'Sauvegarde non reconnue.'};
    var mL=0,mF=0;
    s.lots.forEach(function(l){mL=Math.max(mL,(l.id||0)+1);});
    s.feeds.forEach(function(f){mF=Math.max(mF,(f.id||0)+1);});
    s.nextLot=Math.max(s.nextLot||0,mL);
    s.nextFeed=Math.max(s.nextFeed||0,mF);
    s.lots.forEach(function(l){l.b=l.b||0;l.r=l.r||{};});
    return {ok:true,msg:'Import : '+s.lots.length+' lot(s), '+s.feeds.length+' aliment(s).',state:s};
  }catch(e){return {ok:false,msg:'Fichier illisible.'};}
}
function applyImport(text){
  var r=importJson(text);
  if(r.ok){state=r.state;sel=null;showTrie=false;notice=r.msg;save();renderMap();renderTabs();renderPanel();}
  else{notice=r.msg;renderPanel();}
}
function doImport(file){
  if(!file)return;
  try{
    var rd=new FileReader();
    rd.onload=function(){applyImport(String(rd.result));};
    rd.onerror=function(){notice='Fichier illisible.';renderPanel();};
    rd.readAsText(file);
  }catch(e){notice='Import impossible sur ce navigateur.';renderPanel();}
}

var svg=$('map');
var view={x:0,y:0,w:35.8,h:23.2};
function setVB(){svg.setAttribute('viewBox',view.x+' '+view.y+' '+view.w+' '+view.h);}
function fitView(){
  var r=svg.getBoundingClientRect();
  var s=Math.min(r.width/35.8,Math.max(r.height,1)/23.2);
  view.w=r.width/s;view.h=r.height/s;
  view.x=17.5-view.w/2;view.y=11-view.h/2;
  setVB();
}
function clampView(){
  var cx=view.x+view.w/2,cy=view.y+view.h/2;
  cx=Math.max(-4,Math.min(L+4,cx));cy=Math.max(-3,Math.min(W+3,cy));
  view.x=cx-view.w/2;view.y=cy-view.h/2;
}
function zoomAt(cx,cy,f){
  var r=svg.getBoundingClientRect();
  var px=view.x+((cx-r.left)/r.width)*view.w;
  var py=view.y+((cy-r.top)/r.height)*view.h;
  var nw=Math.max(6,Math.min(90,view.w*f));f=nw/view.w;
  view.w*=f;view.h*=f;
  view.x=px-((cx-r.left)/r.width)*view.w;
  view.y=py-((cy-r.top)/r.height)*view.h;
  clampView();setVB();
}

  AIRES.forEach(function(b,i){

function createLot(name,i,j){

          arm=key;

        save();renderPanel();
      });
    });
    var bok=$('btnFeedOk');
    if(bok)bok.addEventListener('click',function(){

      $('newFeed').value='';
      save();renderPanel();

    var be=$('btnExport');
    if(be)be.addEventListener('click',exportData);

    if(bi2)bi2.addEventListener('click',function(){var f=$('impFile');if(f)f.click();});

    var i=sel.i,j=sel.j,ks=ksOf(i),k1=ks[j],k2=ks[j+1],lid=state.airs[i].lots[j];
    var sg=segsOf(i)[j],n=k2-k1;
    var detail = i===1||i===2 ? n+' col. × 2 côtés = '+sg.pl+' places'
      : i===0 ? n+' places au tapis 1'
      : n+' + '+sg.ts+' (TS) = '+sg.pl+' places';
    el.innerHTML=noticeHtml()+'<div class="ph">'+AIRES[i].lab+' · col. '+k1+' à '+k2+'<button class="closep" id="pClose">'+ic('close',12)+'</button></div>'+
      '<div class="vv" style="margin:2px 0 8px">Ce morceau : '+detail+' · <button class="act" id="btnCut" style="padding:5px 10px;font-size:13px">+ Barrière au milieu</button></div>'+
      '<div class="row"><span class="lbl">Lot</span>'+chipsHtml(lid)+'</div><div class="sep"></div>'+lotSection(lid,false);
    $('pClose').addEventListener('click',function(){sel=null;renderMap();renderTabs();renderPanel();});
    $('btnCut').addEventListener('click',function(){addBarrier(i,j,Math.round((k1+k2)/2));});
    bindChips(i,j);
    bindLot(lid);
    return;
  }
  if(sel.t==='bar'){
    var bi=sel.i,bp=sel.p,k=state.airs[bi].barriers[bp];
    var leftL=lotById(state.airs[bi].lots[bp]),rightL=lotById(state.airs[bi].lots[bp+1]);
    var gL=k-(bp===0?0:state.airs[bi].barriers[bp-1]), gR=(bp===state.airs[bi].barriers.length-1?DBL_PL:state.airs[bi].barriers[bp+1])-k;
    el.innerHTML=noticeHtml()+'<div class="ph">Barrière — '+AIRES[bi].lab+', colonne '+k+'<button class="closep" id="pClose">'+ic('close',12)+'</button></div>'+
      '<div class="row"><button class="act" data-a="bm">◀ 1 place</button><button class="act" data-a="bp">1 place ▶</button><button class="warn" data-a="bd">Supprimer</button></div>'+
      '<div class="vv" style="margin:4px 0">Gauche : '+esc(lotShort(leftL))+' ('+gL+' pl) · Droite : '+esc(lotShort(rightL))+' ('+gR+' pl)</div>'+
      '<div class="hint">Tu peux aussi la glisser directement dans le dessin. 1 place ≈ 33 cm.</div>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-a]'),function(bt){
      bt.addEventListener('click',function(){
        var a=bt.getAttribute('data-a');
        if(a==='bm')moveBarrier(bi,bp,k-1);
        else if(a==='bp')moveBarrier(bi,bp,k+1);
        else delBarrier(bi,bp);
      });
    });
    $('pClose').addEventListener('click',function(){sel=null;renderMap();renderTabs();renderPanel();});
    return;
  }
  if(!lotById(sel.id)){sel=null;renderTabs();renderPanel();return;}
  el.innerHTML=noticeHtml()+lotSection(sel.id,true);
  $('pClose').addEventListener('click',function(){sel=null;renderMap();renderTabs();renderPanel();});
  bindLot(sel.id);
}
function bindChips(i,j){
  Array.prototype.forEach.call($('panel').querySelectorAll('.chip[data-lot]'),function(c){
    c.addEventListener('click',function(){
      var v=c.getAttribute('data-lot');
      notice='';
      if(v==='new'){sel={t:'new',i:i,j:j};}
      else state.airs[i].lots[j]=+v;
      save();renderMap();renderTabs();renderPanel();
    });
  });
}
function bindLot(id){
  var l=lotById(id),st=lotStats(id);
  var inB=$('inB');
  function refresh(kind,fid){
    state.feeds.forEach(function(f){
      var r=feedVal(l,f.id);
      if(!(kind==='fg'&&f.id===fid)&&$('fg_'+f.id))$('fg_'+f.id).value=Math.round(r*1000);
      if(!(kind==='ft'&&f.id===fid)&&$('ft_'+f.id))$('ft_'+f.id).value=fmt((l.b||0)*r,2);
      var pp=perPlace(l,f.id)*1000;
      if($('fp_'+f.id))$('fp_'+f.id).textContent=pp>0.5?'≈ '+Math.round(pp)+' g/pl':'—';
    });
    var max=0;state.feeds.forEach(function(f){max=Math.max(max,lotTot(l,f.id),feedVal(l,f.id));});
    state.feeds.forEach(function(f){
      var w=max>0?Math.max(2,Math.round(Math.max(lotTot(l,f.id),feedVal(l,f.id))/max*100)):0;
      if($('fbar_'+f.id))$('fbar_'+f.id).style.width=w+'%';
    });
    var tot=(l.b||0)*sumRations(l);
    if($('totKg'))$('totKg').textContent=fmt(tot)+' kg';
    if($('totPer'))$('totPer').textContent=l.b>0?'Σ ≈ '+Math.round(sumRations(l)*1000)+' g/brebis/j':'saisis les brebis';
    renderMap();save();
  }
  if(inB)inB.addEventListener('input',function(){l.b=Math.max(0,Math.round(pnum(inB.value)));refresh();});
  state.feeds.forEach(function(f){
    var fg=$('fg_'+f.id),ft=$('ft_'+f.id);
    if(!fg)return;
    fg.addEventListener('input',function(){setFeedVal(l,f.id,Math.max(0,pnum(fg.value))/1000);refresh('fg',f.id);});
    ft.addEventListener('input',function(){if(l.b>0)setFeedVal(l,f.id,Math.max(0,pnum(ft.value))/l.b);refresh('ft',f.id);});
  });
  Array.prototype.forEach.call($('panel').querySelectorAll('.step'),function(bt){
    bt.addEventListener('click',function(){l.b=Math.max(0,l.b+parseInt(bt.getAttribute('data-step'),10));inB.value=l.b;refresh();});
  });
  var ba=$('btnApplyR');
  if(ba)ba.addEventListener('click',function(){
    state.lots.forEach(function(x){if(x.id!==l.id)x.r=JSON.parse(JSON.stringify(l.r||{}));});
    save();renderPanel();
  });
  var br=$('btnRename');
  if(br)br.addEventListener('click',function(){editName=id;renderPanel();});
  var bok=$('btnNameOk');
  if(bok)bok.addEventListener('click',function(){
    l.name=($('editNameIn').value||'').trim()||null;
    editName=null;save();renderMap();renderTabs();renderPanel();
  });
  var bno=$('btnNameNo');
  if(bno)bno.addEventListener('click',function(){editName=null;renderPanel();});
  var bd=$('btnDelLot');
  if(bd)bd.addEventListener('click',function(){
    var stt=lotStats(id);
    if(stt.segs.length){notice='Ce lot a encore '+stt.segs.length+' morceau(x) : attribue-les à un autre lot avant de le supprimer.';renderPanel();return;}
    if(arm==='lot:'+id){
      arm=null;
      state.lots=state.lots.filter(function(x){return x.id!==id;});
      if(!state.lots.length)state.lots=[{id:state.nextLot++,b:0,r:{}}];
      sel=null;notice='Lot supprimé.';
      save();renderMap();renderTabs();renderPanel();
    }else{
      arm='lot:'+id;
      setTimeout(function(){if(arm==='lot:'+id){arm=null;renderPanel();}},4000);
      renderPanel();
    }
  });
}

/* ============ barrières ============ */
function insertBarrier(i,k){
  var a=state.airs[i],p=0;
  while(p<a.barriers.length&&a.barriers[p]<k)p++;
  var lo=p===0?1:a.barriers[p-1]+1, hi=p===a.barriers.length?DBL_PL-1:a.barriers[p]-1;
  if(lo>hi)return -1;
  k=Math.max(lo,Math.min(hi,k));
  a.barriers.splice(p,0,k);
  a.lots.splice(p+1,0,a.lots[p]);
  return p;
}
function addBarrier(i,j,k){
  var a=state.airs[i];
  var lo=j===0?1:a.barriers[j-1]+1, hi=j===a.barriers.length?DBL_PL-1:a.barriers[j]-1;
  if(lo>hi){notice='Plus de place dans ce morceau.';renderPanel();return;}
  k=Math.max(lo,Math.min(hi,k));
  a.barriers.splice(j,0,k);
  a.lots.splice(j+1,0,a.lots[j]);
  save();
  sel={t:'bar',i:i,p:j};
  renderMap();renderTabs();renderPanel();
}
function moveBarrier(i,p,k){
  var a=state.airs[i];
  var lo=p===0?1:a.barriers[p-1]+1, hi=p===a.barriers.length-1?DBL_PL-1:a.barriers[p+1]-1;
  k=Math.max(lo,Math.min(hi,k));
  if(k===a.barriers[p])return;
  a.barriers[p]=k;save();renderMap();renderPanel();
}
function moveBarrierLive(i,p,k){
  var a=state.airs[i];
  var lo=p===0?1:a.barriers[p-1]+1, hi=p===a.barriers.length-1?DBL_PL-1:a.barriers[p+1]-1;
  k=Math.max(lo,Math.min(hi,k));
  if(k===a.barriers[p])return;
  a.barriers[p]=k;save();
}
function delBarrier(i,p){
  var a=state.airs[i];
  a.barriers.splice(p,1);
  a.lots.splice(p,2,a.lots[p]);
  sel=null;save();renderMap();renderTabs();renderPanel();
}
function kFromX(x){return Math.max(1,Math.min(DBL_PL-1,Math.round((x-DBL_X0)/DBL_LEN*DBL_PL)));}

/* ============ interactions carte ============ */
function toSvg(cx,cy){
  var r=svg.getBoundingClientRect();
  return {x:view.x+((cx-r.left)/r.width)*view.w, y:view.y+((cy-r.top)/r.height)*view.h};
}
function aireAt(y){for(var i=0;i<4;i++){if(y>=AIRES[i].y-0.15&&y<=AIRES[i].y+AIRES[i].h+0.15)return i;}return -1;}
function hitBarrier(p){
  var ai=aireAt(p.y);if(ai<0)return null;
  var tol=14/svg.getBoundingClientRect().width*view.w,bp=-1,bd=1e9;
  state.airs[ai].barriers.forEach(function(k,ix){var d=Math.abs(p.x-xOfK(k));if(d<tol&&d<bd){bd=d;bp=ix;}});
  return bp<0?null:{i:ai,p:bp};
}
function segAt(p){
  var ai=aireAt(p.y);
  if(ai<0||p.x<-0.2||p.x>L+0.2)return null;
  if(p.x>DBL_END+0.2)return {i:ai,j:state.airs[ai].lots.length-1};
  var kF=(p.x-DBL_X0)/DBL_LEN*DBL_PL,ks=ksOf(ai);
  for(var j=0;j<ks.length-1;j++)if(kF>=ks[j]-1e-9&&kF<=ks[j+1]+1e-9)return {i:ai,j:j};
  return null;
}
var ptrs={},gest={mode:null,bar:null,moved:0,pc:null,pinch:null,timer:null,longOk:false,pDown:null};
function nPtrs(){return Object.keys(ptrs).length;}
function pinchInfo(){
  var a=[];for(var id in ptrs)a.push(ptrs[id]);
  return {cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,d:Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y))};
}
function clearTimer(){if(gest.timer){clearTimeout(gest.timer);gest.timer=null;}}
svg.addEventListener('contextmenu',function(e){e.preventDefault();});
svg.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{svg.setPointerCapture(e.pointerId);}catch(err){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(nPtrs()===1){
    gest.moved=0;gest.pc={x:e.clientX,y:e.clientY};gest.longOk=false;
    var p=toSvg(e.clientX,e.clientY);gest.pDown=p;
    var bI=hitBarrier(p);
    if(bI){gest.mode='bar';gest.bar=bI;sel={t:'bar',i:bI.i,p:bI.p};setPanelMin(false);renderMap();renderPanel();}
    else{
      gest.mode='pan';
      gest.timer=setTimeout(function(){
        if(gest.mode==='pan'&&gest.moved<10&&nPtrs()===1){
          var sg=segAt(gest.pDown);
          if(sg){
            var p2=insertBarrier(sg.i,kFromX(gest.pDown.x));
            if(p2>=0){save();sel={t:'bar',i:sg.i,p:p2};gest.longOk=true;setPanelMin(false);renderMap();renderPanel();}
          }
        }
      },600);
    }
  }else{
    clearTimer();gest.mode='pinch';gest.bar=null;gest.pinch=pinchInfo();
  }
});
svg.addEventListener('pointermove',function(e){
  if(!(e.pointerId in ptrs))return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(nPtrs()>=2){
    if(gest.mode!=='pinch'){clearTimer();gest.mode='pinch';gest.bar=null;gest.pinch=pinchInfo();return;}
    var pi=pinchInfo();
    if(gest.pinch){
      zoomAt(gest.pinch.cx,gest.pinch.cy,gest.pinch.d/pi.d);
      var r=svg.getBoundingClientRect();
      view.x-=(pi.cx-gest.pinch.cx)/r.width*view.w;
      view.y-=(pi.cy-gest.pinch.cy)/r.height*view.h;
      clampView();setVB();
    }
    gest.pinch=pi;
    return;
  }
  gest.moved=Math.max(gest.moved,Math.abs(e.clientX-gest.pc.x),Math.abs(e.clientY-gest.pc.y));
  if(gest.moved>=10)clearTimer();
  if(gest.mode==='bar'&&gest.bar){
    var p=toSvg(e.clientX,e.clientY);
    moveBarrierLive(gest.bar.i,gest.bar.p,kFromX(p.x));
  }else if(gest.mode==='pan'){
    view.x-=(e.clientX-gest.pc.x)/svg.getBoundingClientRect().width*view.w;
    view.y-=(e.clientY-gest.pc.y)/svg.getBoundingClientRect().height*view.h;
    clampView();setVB();
    gest.pc={x:e.clientX,y:e.clientY};
  }
});
function endPtr(e){
  if(!(e.pointerId in ptrs))return;
  delete ptrs[e.pointerId];
  if(nPtrs()===1){
    clearTimer();
    for(var id in ptrs){gest.pc={x:ptrs[id].x,y:ptrs[id].y};break;}
    gest.mode='pan';gest.bar=null;gest.pinch=null;
    return;
  }
  if(nPtrs()===0){
    clearTimer();
    if(gest.mode==='bar'){renderPanel();}
    else if(gest.mode==='pan'&&!gest.longOk&&gest.moved<10){
      var p=toSvg(e.clientX,e.clientY),bI=hitBarrier(p);
      if(bI)sel={t:'bar',i:bI.i,p:bI.p};
      else{
        var sg=segAt(p);
        sel=sg?{t:'seg',i:sg.i,j:sg.j}:null;
      }
      if(sel)setPanelMin(false);
      notice='';arm=null;
      renderMap();renderTabs();renderPanel();
    }
    gest.mode=null;gest.bar=null;gest.pinch=null;gest.longOk=false;
  }
}
svg.addEventListener('pointerup',endPtr);
svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY>0?1.15:0.87);},{passive:false});

/* ============ boutons ============ */
$('btnReset').innerHTML=ic('reset',16);
$('zin').innerHTML=ic('zin',16);
$('zout').innerHTML=ic('zout',16);
$('zfit').innerHTML=ic('fit',16);
$('btnReset').addEventListener('click',function(){
  var rB=$('btnReset');
  if(arm==='reset'){
    arm=null;rB.classList.remove('warn');rB.innerHTML=ic('reset',16);
    state=defaultState();sel=null;showTrie=false;notice='';
    save();renderMap();renderTabs();renderPanel();
    return;
  }
  arm='reset';rB.classList.add('warn');rB.innerHTML=ic('warn',16);
  setTimeout(function(){if(arm==='reset'){arm=null;rB.classList.remove('warn');rB.innerHTML=ic('reset',16);}},4000);
});
$('zin').addEventListener('click',function(){var r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.8);});
$('zout').addEventListener('click',function(){var r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25);});
$('zfit').addEventListener('click',fitView);
$('pcol').addEventListener('click',function(){setPanelMin(!panelMin);});
var lastAspect=0;
window.addEventListener('resize',function(){
  var r=svg.getBoundingClientRect(),a=r.width/Math.max(1,r.height);
  if(lastAspect&&Math.abs(a/lastAspect-1)>0.25)fitView();
  lastAspect=a;
});

/* ============ départ ============ */
save();
fitView();
renderMap();
renderTabs();
setPanelMin((window.innerWidth||920)<920);
renderPanel();
if(typeof navigator!=='undefined'&&navigator.serviceWorker&&typeof location!=='undefined'&&/^https:$/.test(location.protocol)){
  try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
}
</script>
