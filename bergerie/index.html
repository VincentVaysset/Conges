
<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma bergerie — lots & rations</title>
<style>
  :root{--vert:#3c7a4e;--creme:#fbf8f1;--orange:#e3812f;--danger:#d1584f;--encre:#2f2a26;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--creme);color:var(--encre);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{background:var(--vert);color:#fff;padding:10px 12px}
  .hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap}
  button{font:inherit;border:none;border-radius:9px;padding:8px 12px;cursor:pointer}
  .btnw{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
  .btnw:active{background:rgba(255,255,255,.32)}
  #mapWrap{flex:1;position:relative;min-height:0;background:#efe9dc}
  #map{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .zooms{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
  .zooms button{width:38px;height:38px;background:#fff;border:1px solid #c9c2b6;color:var(--encre);font-size:17px;display:flex;align-items:center;justify-content:center;padding:0}
  #panel{background:#fff;border-top:1px solid #ddd6c8;padding:10px 12px 14px;max-height:50dvh;overflow:auto;flex-shrink:0}
  .ph{font-weight:700;color:var(--vert);display:flex;align-items:center;gap:8px;margin:2px 0 4px;flex-wrap:wrap}
  .dot{width:14px;height:14px;border-radius:5px;display:inline-block;flex-shrink:0}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
  .lbl{font-size:14px;color:#5a5248;min-width:82px}
  .vv{font-size:14px;color:#4a4440;line-height:1.4}
  .big{font-size:16px;font-weight:700}
  button.step{width:42px;height:42px;background:var(--creme);border:1px solid #c9c2b6;color:var(--encre);font-size:20px;padding:0}
  button.act{background:var(--vert);color:#fff}
  button.warn{background:var(--danger);color:#fff}
  .closep{margin-left:auto;background:#efe9dc;color:#5a5248;padding:4px 10px;border-radius:8px}
  .btnsm{background:#efe9dc;color:#5a5248;padding:4px 8px;border-radius:8px;font-size:14px}
  input{font:inherit;border:1px solid #c9c2b6;border-radius:9px;padding:9px 8px;background:#fff;color:var(--encre);font-size:16px;text-align:center}
  input.short{width:76px}
  .hint{font-size:13px;color:#7a7267;margin-top:8px;line-height:1.45}
  .sep{border-top:1px solid #eee7d8;margin:10px 0}
  .chip{border-radius:999px;padding:7px 13px;border:2px solid transparent;font-weight:600;background:#efe9dc;color:var(--encre)}
  .chip.on{border-color:#2f2a26}
  .fcard{border-radius:12px;padding:8px 10px;margin:8px 0}
  .fc-top{display:flex;align-items:center;gap:6px}
  .fc-emoji{font-size:18px}
  .fc-name{font-weight:700;flex:1}
  .fc-bar{height:9px;border-radius:5px;background:#eee7d8;margin:6px 0 4px;overflow:hidden}
  .fc-fill{height:100%;border-radius:5px}
  .fc-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0;font-size:15px}
  .tot b{font-size:18px}
  .mini{font-size:12px;border-radius:8px;padding:2px 7px;margin:1px;display:inline-block}
  .lotsList .lrow{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #eee7d8;cursor:pointer;flex-wrap:wrap}
  .lotsList .lrow:active{background:#f6f1e6}
  .lrow .nm{font-weight:700}
  .su{font-size:12px;color:#9a9184;border:1px solid #d8d1c3;border-radius:6px;padding:2px 6px;margin-left:2px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>🐑 Ma bergerie — lots &amp; rations</h1>
    <button class="btnw" id="btnReset" title="Tout remettre à zéro">⟲</button>
  </div>
</header>
<main id="mapWrap">
  <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="zooms">
    <button id="zin" title="Zoomer">＋</button>
    <button id="zout" title="Dézoomer">－</button>
    <button id="zfit" title="Vue complète">▢</button>
  </div>
</main>
<section id="panel"></section>
<script>
'use strict';
/* ============ BERGERIE — valeurs ajustables ============
   35 m × 22 m — 3 places au mètre
   Aires : toute la longueur (35 m). Seuls les tapis sont plus courts :
   Tapis doubles : 92 places/côté (~30,67 m) — Tapis simple : 102 places (34 m)
   Bandes : Aire 1 / Tapis 1 / Aire 2 / Tapis 2 / Aire 3 / Tapis 3 / Aire 4 / Tapis simple / couloir */
var L=35, W=22, PL_M=3, DBL_PL=92, TS_PL=102;
var DBL_X0=0, DBL_LEN=DBL_PL/PL_M, DBL_END=DBL_X0+DBL_LEN;   /* doubles : 0 → 30,67 m */
var TS_X0=0, TS_LEN=TS_PL/PL_M, TS_END=TS_X0+TS_LEN;         /* simple : 0 → 34 m */
var AIRES=[
  {y:0.0,  h:4.3,lab:'Aire 1'},
  {y:5.0,  h:4.3,lab:'Aire 2'},
  {y:10.0, h:4.3,lab:'Aire 3'},
  {y:15.0, h:4.3,lab:'Aire 4'}
];
var TAPIS=[
  {y:4.3,  h:0.7,x1:DBL_END,lab:'Tapis double 1'},
  {y:9.3,  h:0.7,x1:DBL_END,lab:'Tapis double 2'},
  {y:14.3, h:0.7,x1:DBL_END,lab:'Tapis double 3'},
  {y:19.3, h:0.7,x1:TS_END, lab:'Tapis simple'}
];
var LOT_COLS=['#a8d5b0','#f5cfa0','#a9cbe8','#f2b8cf','#e8e0a0','#c9b8e8','#9fd9c8','#f0b9a0'];
var FEED_COLS=['#6a994e','#d9a441','#7b6cbf','#4d8fd1','#c96a5b','#3ba99c','#b5853f','#8a8f5a'];

/* ============ état ============ */
var KEY='bergerie_lots_v3';
function defaultState(){
  return {nextLot:1,nextFeed:1,
    feeds:[{id:0,name:'Aliment'}],
    lots:[{id:0,b:0,rt:{'0':0},name:null}],
    airs:[0,1,2,3].map(function(){return {barriers:[],lots:[0]};})};
}
function loadS(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lots&&s.airs&&s.feeds)return s;}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
var state=loadS()||defaultState();
var sel=null;

/* ============ géométrie ============ */
function xOfK(k){return DBL_X0+DBL_LEN*k/DBL_PL;}
function cumT(k){return Math.round(TS_PL*xOfK(k)/TS_LEN);}
function ksOf(i){return [0].concat(state.airs[i].barriers,[DBL_PL]);}
function tsOf(k1,k2,isLast){return (isLast?TS_PL:cumT(k2))-cumT(k1);}
function segsOf(i){
  var ks=ksOf(i),o=[];
  for(var j=0;j<ks.length-1;j++){
    var k1=ks[j],k2=ks[j+1],isLast=j===ks.length-2,ts=(i===3)?tsOf(k1,k2,isLast):0;
    var n=k2-k1;
    o.push({j:j,k1:k1,k2:k2,isLast:isLast,lot:state.airs[i].lots[j],ts:ts,
      pl:i===0?n:(i===1||i===2?2*n:n+ts)});
  }
  return o;
}
function lotById(id){for(var x=0;x<state.lots.length;x++)if(state.lots[x].id===id)return state.lots[x];return null;}
function lotCol(id){return LOT_COLS[id%LOT_COLS.length];}
function colFeed(id){return FEED_COLS[id%FEED_COLS.length];}
function lotName(l){return l&&l.name?l.name:'Lot '+(l.id+1);}
function lotShort(l){return l&&l.name?l.name.slice(0,14):'L'+(l.id+1);}
function lotStats(id){
  var t=[0,0,0,0],segs=[];
  for(var i=0;i<4;i++)segsOf(i).forEach(function(sg){
    if(sg.lot!==id)return;
    var n=sg.k2-sg.k1;
    if(i===0)t[0]+=n; else if(i===1){t[0]+=n;t[1]+=n;} else if(i===2){t[1]+=n;t[2]+=n;} else {t[2]+=n;t[3]+=sg.ts;}
    segs.push({air:i+1,k1:sg.k1,k2:sg.k2,pl:sg.pl});
  });
  return {t:t,P:t[0]+t[1]+t[2]+t[3],segs:segs};
}
function feedVal(l,fid){return (l.rt&&l.rt[fid])||0;}
function setFeedVal(l,fid,v){l.rt=l.rt||{};l.rt[fid]=v;}
function sumRations(l){var s=0;state.feeds.forEach(function(f){s+=feedVal(l,f.id);});return s;}
function feedEmoji(name){
  var n=(name||'').toLowerCase();
  if(/blé|blé |orge|avoine|tritic|céré|cereal/.test(n))return '🌾';
  if(/maïs|mais|corn/.test(n))return '🌽';
  if(/tourteau|soja|colza|pois|féverole|feverole/.test(n))return '🫘';
  if(/foin|luzerne|herbe|fourr|paille/.test(n))return '🌿';
  if(/pulpe|betterave/.test(n))return '🍠';
  if(/lait/.test(n))return '🥛';
  if(/minéral|mineral|sel|vitamine|vita/.test(n))return '🧂';
  return '🌰';
}
function fmt(n,d){if(d==null)d=2;return (+(n.toFixed(d))).toFixed(d).replace('.',',');}
function pnum(v){var x=parseFloat(String(v).replace(',','.'));return isNaN(x)?0:x;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}

var svg=$('map');
var view={x:0,y:0,w:35.8,h:23.2};
function setVB(){svg.setAttribute('viewBox',view.x+' '+view.y+' '+view.w+' '+view.h);}
function fitView(){
  var r=svg.getBoundingClientRect();
  var s=Math.min(r.width/35.8,Math.max(r.height,1)/23.2);
  view.w=r.width/s;view.h=r.height/s;
  view.x=17.5-view.w/2;view.y=11-view.h/2;
  setVB();
}
function clampView(){
  var cx=view.x+view.w/2,cy=view.y+view.h/2;
  cx=Math.max(-4,Math.min(L+4,cx));cy=Math.max(-3,Math.min(W+3,cy));
  view.x=cx-view.w/2;view.y=cy-view.h/2;
}
function zoomAt(cx,cy,f){
  var r=svg.getBoundingClientRect();
  var px=view.x+((cx-r.left)/r.width)*view.w;
  var py=view.y+((cy-r.top)/r.height)*view.h;
  var nw=Math.max(6,Math.min(90,view.w*f));f=nw/view.w;
  view.w*=f;view.h*=f;
  view.x=px-((cx-r.left)/r.width)*view.w;
  view.y=py-((cy-r.top)/r.height)*view.h;
  clampView();setVB();
}

/* ============ dessin ============ */
function renderMap(){
  var o=[];
  o.push('<rect x="0" y="0" width="'+L+'" height="'+W+'" fill="#f0ead9"/>');
  o.push('<rect x="0" y="20" width="'+L+'" height="2" fill="#e7efe4" stroke="#b9cdb6" stroke-width="0.06"/>');
  o.push('<text x="'+(L/2)+'" y="21.2" font-size="0.85" fill="#6f8a6b" text-anchor="middle">Couloir d’alimentation</text>');
  AIRES.forEach(function(b){
    o.push('<rect x="0" y="'+b.y+'" width="'+L+'" height="'+b.h+'" fill="#f6efdd" stroke="#cfc7b8" stroke-width="0.05"/>');
  });
  TAPIS.forEach(function(b){
    o.push('<rect x="0" y="'+b.y+'" width="'+L+'" height="'+b.h+'" fill="#e6ddca"/>');
    o.push('<rect x="0" y="'+b.y+'" width="'+b.x1+'" height="'+b.h+'" fill="#d7e5d2" stroke="#cfc7b8" stroke-width="0.05"/>');
  });
  AIRES.forEach(function(b,i){
    segsOf(i).forEach(function(sg){
      var left=xOfK(sg.k1), right=sg.isLast?L:xOfK(sg.k2);
      if(right-left<=0)return;
      o.push('<rect x="'+left+'" y="'+b.y+'" width="'+(right-left)+'" height="'+b.h+'" fill="'+lotCol(sg.lot)+'" opacity="0.55"/>');
      if(sel&&sel.t==='seg'&&sel.i===i&&sel.j===sg.j)
        o.push('<rect x="'+left+'" y="'+(b.y-0.05)+'" width="'+(right-left)+'" height="'+(b.h+0.1)+'" fill="none" stroke="#3c7a4e" stroke-width="0.22"/>');
      var cx=(left+right)/2,w=right-left,lo=lotById(sg.lot);
      if(w>=1.4){
        o.push('<text x="'+cx+'" y="'+(b.y+b.h/2-0.1)+'" font-size="0.75" font-weight="700" fill="#33402f" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0.12" stroke-opacity="0.85">'+esc(lotShort(lo))+'</text>');
        if(w>=3.2)o.push('<text x="'+cx+'" y="'+(b.y+b.h/2+0.85)+'" font-size="0.55" fill="#5a5248" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0.1" stroke-opacity="0.85">'+sg.pl+' pl.</text>');
      }
    });
  });
  AIRES.forEach(function(b){
    o.push('<text x="0.45" y="'+(b.y+0.85)+'" font-size="0.75" fill="#9a8f7c" paint-order="stroke" stroke="#ffffff" stroke-width="0.1" stroke-opacity="0.75">'+b.lab+'</text>');
  });
  TAPIS.forEach(function(b){
    o.push('<text x="0.4" y="'+(b.y+b.h/2+0.18)+'" font-size="0.5" fill="#4f6b4a" paint-order="stroke" stroke="#ffffff" stroke-width="0.1" stroke-opacity="0.75">'+b.lab+'</text>');
  });
  AIRES.forEach(function(b,i){
    state.airs[i].barriers.forEach(function(k,p){
      var x=xOfK(k),isSel=sel&&sel.t==='bar'&&sel.i===i&&sel.p===p,sc=isSel?'#e3812f':'#a34e37';
      o.push('<line x1="'+x+'" y1="'+b.y+'" x2="'+x+'" y2="'+(b.y+b.h)+'" stroke="'+sc+'" stroke-width="'+(isSel?0.3:0.2)+'" stroke-dasharray="0.55 0.35"/>');
      o.push('<circle cx="'+x+'" cy="'+(b.y+b.h/2)+'" r="'+(isSel?0.55:0.45)+'" fill="'+sc+'" stroke="#ffffff" stroke-width="0.09"/>');
      if(isSel)o.push('<text x="'+x+'" y="'+(b.y+0.5)+'" font-size="0.6" font-weight="700" fill="#a34e37" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="0.12">col. '+k+'</text>');
    });
  });
  o.push('<rect x="0" y="0" width="'+L+'" height="'+W+'" fill="none" stroke="#7a6f63" stroke-width="0.16"/>');
  svg.innerHTML=o.join('');
}

/* ============ panneau ============ */
function segsTxt(st){return st.segs.map(function(s){return 'Aire '+s.air+' (col. '+s.k1+'–'+s.k2+')';}).join(' · ')||'aucun morceau';}
function chipsHtml(cur){
  var h='';
  state.lots.forEach(function(l){
    h+='<button class="chip'+(l.id===cur?' on':'')+'" data-lot="'+l.id+'" style="background:'+lotCol(l.id)+'">'+esc(lotShort(l))+'</button>';
  });
  h+='<button class="chip" data-lot="new">＋ Lot</button>';
  return h;
}
function lotSection(id,withClose){
  var l=lotById(id),st=lotStats(id);
  if(!l)return '';
  l.b=l.b||0;
  var cards='',max=0;
  state.feeds.forEach(function(f){max=Math.max(max,st.P*feedVal(l,f.id));});
  state.feeds.forEach(function(f){
    var r=feedVal(l,f.id),t=st.P*r,per=l.b>0?t/l.b:null;
    var w=max>0?Math.max(2,Math.round(t/max*100)):0;
    cards+='<div class="fcard" style="background:'+colFeed(f.id)+'1e">'+
      '<div class="fc-top"><span class="fc-emoji">'+feedEmoji(f.name)+'</span><span class="fc-name">'+esc(f.name)+'</span><span class="su" id="fp_'+f.id+'">'+(per==null?'—':Math.round(per*1000)+' g/brebis')+'</span></div>'+
      '<div class="fc-bar"><div class="fc-fill" id="fbar_'+f.id+'" style="background:'+colFeed(f.id)+';width:'+w+'%"></div></div>'+
      '<div class="fc-row"><input class="short" id="fr_'+f.id+'" inputmode="decimal" value="'+fmt(r,3)+'"><span class="vv">kg/pl</span><span class="vv">↔</span><input class="short" id="ft_'+f.id+'" inputmode="decimal" value="'+fmt(t,2)+'"><span class="vv">kg</span></div>'+
      '</div>';
  });
  if(!state.feeds.length)cards='<div class="vv">Aucun aliment : ajoute-en dans le résumé.</div>';
  var tot=st.P*sumRations(l),perAll=l.b>0?tot/l.b:null;
  return '<div class="ph"><span class="dot" style="background:'+lotCol(id)+'"></span>'+esc(lotName(l))+
      '<button class="btnsm" id="btnRename">✏️</button><button class="btnsm" id="btnDelLot">🗑</button>'+
      (withClose?'<button class="closep" id="pClose">✕</button>':'')+'</div>'+
    '<div class="row"><span class="lbl">Brebis</span><button class="step" data-step="-1">−</button><input id="inB" inputmode="numeric" value="'+l.b+'" style="width:70px"><button class="step" data-step="1">＋</button></div>'+
    '<div class="row"><span class="lbl">Morceaux</span><span class="vv">'+segsTxt(st)+'</span></div>'+
    '<div class="row"><span class="lbl">Places</span><span class="vv">T1 '+st.t[0]+' · T2 '+st.t[1]+' · T3 '+st.t[2]+' · TS '+st.t[3]+' → <b>'+st.P+' places</b></span></div>'+
    '<div class="sep"></div>'+
    cards+
    '<div class="tot">Total du lot <b id="totKg">'+fmt(tot)+' kg</b><span class="su" id="totPer">'+(perAll==null?'saisis les brebis':'≈ '+Math.round(perAll*1000)+' g / brebis')+'</span></div>'+
    '<div class="row"><button class="act" id="btnApplyR">Appliquer ces rations à tous les lots</button></div>'+
    '<div class="hint">Change kg/place ou les kg du lot : tout se recalcule (barres et g/brebis).</div>';
}
function feedsManagerHtml(){
  var h='<div class="ph">Aliments</div>';
  state.feeds.forEach(function(f){
    h+='<div class="frow" style="display:flex;align-items:center;gap:6px;margin:6px 0">'+
      '<button class="chip" data-rename="'+f.id+'" style="background:'+colFeed(f.id)+'1e">'+feedEmoji(f.name)+' '+esc(f.name)+'</button>'+
      '<button class="btnsm" data-delf="'+f.id+'">🗑</button></div>';
  });
  h+='<div class="fc-row" style="margin:6px 0"><input id="newFeed" placeholder="nom" style="width:130px;text-align:left"><button class="chip" id="btnAddFeed">＋ Aliment</button></div>';
  return h;
}
function renderPanel(){
  var el=$('panel');
  if(!sel){
    var rows='',B=0,T=0,P=0;
    state.lots.forEach(function(l){
      var st=lotStats(l.id);B+=l.b||0;P+=st.P;T+=st.P*sumRations(l);
      var minis='';
      state.feeds.forEach(function(f){
        var t=st.P*feedVal(l,f.id);
        if(t>0)minis+='<span class="mini" style="background:'+colFeed(f.id)+'1e">'+feedEmoji(f.name)+' '+fmt(t,1)+' kg</span>';
      });
      rows+='<div class="lrow" data-lot="'+l.id+'"><span class="dot" style="background:'+lotCol(l.id)+'"></span><span class="nm">'+esc(lotName(l))+'</span>'+
        '<span class="vv">'+((l.b||0)>0?l.b+' 🐑':'—')+'</span><span class="vv">'+st.P+' pl.</span>'+minis+'</div>';
    });
    el.innerHTML='<div class="ph">Lots — '+state.lots.length+'</div><div class="lotsList">'+rows+'</div>'+
      '<div class="row" style="margin:4px 0"><button class="act" id="btnNewLot">＋ Nouveau lot</button></div>'+
      '<div class="row big" style="margin-top:2px">'+B+' 🐑 · '+P+' places · '+fmt(T)+' kg</div>'+
      '<div class="sep"></div>'+feedsManagerHtml()+
      '<div class="hint">Touche un morceau d’aire pour choisir son lot et saisir les brebis. <b>Appui long dans une aire</b> = barrière. Touche une barrière pour la déplacer. Touche un aliment pour le renommer.</div>';
    Array.prototype.forEach.call(el.querySelectorAll('.lrow'),function(r){
      r.addEventListener('click',function(){sel={t:'lot',id:+r.getAttribute('data-lot')};renderMap();renderPanel();});
    });
    $('btnNewLot').addEventListener('click',function(){
      var n=prompt('Nom du lot ? (ex. Agnelles — facultatif)','');
      if(n===null)return;
      state.lots.push({id:state.nextLot++,b:0,rt:{},name:n.trim()||null});
      save();renderPanel();
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-rename]'),function(c){
      c.addEventListener('click',function(){
        var f=null,id=+c.getAttribute('data-rename');
        state.feeds.forEach(function(x){if(x.id===id)f=x;});
        var n=prompt('Nouveau nom de l’aliment ?',f?f.name:'');
        if(n&&n.trim()){f.name=n.trim();save();renderPanel();}
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-delf]'),function(c){
      c.addEventListener('click',function(){
        var id=+c.getAttribute('data-delf'),f=null;
        state.feeds.forEach(function(x){if(x.id===id)f=x;});
        if(!confirm('Supprimer « '+(f?f.name:'')+' » ? Les rations de cet aliment seront effacées.'))return;
        state.feeds=state.feeds.filter(function(x){return x.id!==id;});
        state.lots.forEach(function(l){if(l.rt)delete l.rt[id];});
        save();renderPanel();
      });
    });
    $('btnAddFeed').addEventListener('click',function(){
      var n=$('newFeed').value.trim();
      if(!n)n=prompt('Nom du nouvel aliment ?','');
      if(!n)return;
      state.feeds.push({id:state.nextFeed++,name:n.trim()});
      save();renderPanel();
    });
    return;
  }
  if(sel.t==='seg'){
    var i=sel.i,j=sel.j,ks=ksOf(i),k1=ks[j],k2=ks[j+1],lid=state.airs[i].lots[j];
    var sg=segsOf(i)[j],n=k2-k1;
    var detail = i===1||i===2 ? n+' col. × 2 côtés = '+sg.pl+' places'
      : i===0 ? n+' places au tapis 1'
      : n+' + '+sg.ts+' (TS) = '+sg.pl+' places';
    el.innerHTML='<div class="ph">'+AIRES[i].lab+' · col. '+k1+' à '+k2+'<button class="closep" id="pClose">✕</button></div>'+
      '<div class="vv" style="margin:2px 0 8px">Ce morceau : '+detail+' · <button class="act" id="btnCut" style="padding:5px 10px;font-size:13px">＋ Barrière au milieu</button></div>'+
      '<div class="row"><span class="lbl">Lot</span>'+chipsHtml(lid)+'</div><div class="sep"></div>'+lotSection(lid,false);
    $('pClose').addEventListener('click',function(){sel=null;renderMap();renderPanel();});
    $('btnCut').addEventListener('click',function(){addBarrier(i,j,Math.round((k1+k2)/2));});
    bindChips(i,j);
    bindLot(lid);
    return;
  }
  if(sel.t==='bar'){
    var bi=sel.i,bp=sel.p,k=state.airs[bi].barriers[bp];
    var leftL=lotById(state.airs[bi].lots[bp]),rightL=lotById(state.airs[bi].lots[bp+1]);
    el.innerHTML='<div class="ph">Barrière — '+AIRES[bi].lab+', colonne '+k+'<button class="closep" id="pClose">✕</button></div>'+
      '<div class="row"><button class="act" data-a="bm">◀ 1 place</button><button class="act" data-a="bp">1 place ▶</button><button class="warn" data-a="bd">Supprimer</button></div>'+
      '<div class="vv" style="margin:4px 0">Gauche : '+esc(lotShort(leftL))+' · Droite : '+esc(lotShort(rightL))+'</div>'+
      '<div class="hint">Tu peux aussi la glisser directement dans le dessin. 1 place ≈ 33 cm.</div>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-a]'),function(bt){
      bt.addEventListener('click',function(){
        var a=bt.getAttribute('data-a');
        if(a==='bm')moveBarrier(bi,bp,k-1);
        else if(a==='bp')moveBarrier(bi,bp,k+1);
        else delBarrier(bi,bp);
      });
    });
    $('pClose').addEventListener('click',function(){sel=null;renderMap();renderPanel();});
    return;
  }
  el.innerHTML=lotSection(sel.id,true);
  $('pClose').addEventListener('click',function(){sel=null;renderMap();renderPanel();});
  bindLot(sel.id);
}
function bindChips(i,j){
  Array.prototype.forEach.call($('panel').querySelectorAll('.chip[data-lot]'),function(c){
    c.addEventListener('click',function(){
      var v=c.getAttribute('data-lot');
      if(v==='new'){
        var nm=prompt('Nom du nouveau lot ? (facultatif)','');
        if(nm===null)return;
        var cur=lotById(state.airs[i].lots[j]);
        var id=state.nextLot++;
        state.lots.push({id:id,b:0,rt:cur?JSON.parse(JSON.stringify(cur.rt||{})):{},name:nm.trim()||null});
        state.airs[i].lots[j]=id;
      } else state.airs[i].lots[j]=+v;
      save();
      renderMap();renderPanel();
    });
  });
}
function bindLot(id){
  var l=lotById(id),st=lotStats(id);
  var inB=$('inB');
  function refresh(kind,fid){
    state.feeds.forEach(function(f){
      var r=feedVal(l,f.id);
      if(!(kind==='fr'&&f.id===fid)&&$('fr_'+f.id))$('fr_'+f.id).value=fmt(r,3);
      if(!(kind==='ft'&&f.id===fid)&&$('ft_'+f.id))$('ft_'+f.id).value=fmt(st.P*r,2);
      var per=l.b>0?st.P*r/l.b*1000:null;
      if($('fp_'+f.id))$('fp_'+f.id).textContent=per==null?'—':Math.round(per)+' g/brebis';
    });
    var max=0;state.feeds.forEach(function(f){max=Math.max(max,st.P*feedVal(l,f.id));});
    state.feeds.forEach(function(f){
      var t=st.P*feedVal(l,f.id);
      if($('fbar_'+f.id))$('fbar_'+f.id).style.width=(max>0?Math.max(2,Math.round(t/max*100)):0)+'%';
    });
    var tot=st.P*sumRations(l);
    if($('totKg'))$('totKg').textContent=fmt(tot)+' kg';
    if($('totPer'))$('totPer').textContent=l.b>0?'≈ '+Math.round(tot/l.b*1000)+' g / brebis':'saisis les brebis';
    renderMap();save();
  }
  inB.addEventListener('input',function(){l.b=Math.max(0,Math.round(pnum(inB.value)));refresh();});
  state.feeds.forEach(function(f){
    var fr=$('fr_'+f.id),ft=$('ft_'+f.id);
    if(!fr)return;
    fr.addEventListener('input',function(){setFeedVal(l,f.id,Math.max(0,pnum(fr.value)));refresh('fr',f.id);});
    ft.addEventListener('input',function(){setFeedVal(l,f.id,st.P>0?Math.max(0,pnum(ft.value))/st.P:0);refresh('ft',f.id);});
  });
  Array.prototype.forEach.call($('panel').querySelectorAll('.step'),function(bt){
    bt.addEventListener('click',function(){l.b=Math.max(0,l.b+parseInt(bt.getAttribute('data-step'),10));inB.value=l.b;refresh();});
  });
  var ba=$('btnApplyR');
  if(ba)ba.addEventListener('click',function(){
    state.lots.forEach(function(x){if(x.id!==l.id)x.rt=JSON.parse(JSON.stringify(l.rt||{}));});
    save();renderPanel();
  });
  var br=$('btnRename');
  if(br)br.addEventListener('click',function(){
    var n=prompt('Nom du lot ?',l.name||'');
    if(n===null)return;
    l.name=n.trim()||null;save();renderMap();renderPanel();
  });
  var bd=$('btnDelLot');
  if(bd)bd.addEventListener('click',function(){
    var stt=lotStats(id);
    if(stt.segs.length){alert('Ce lot a encore '+stt.segs.length+' morceau(x) : attribue-les à un autre lot avant de le supprimer.');return;}
    if(!confirm('Supprimer « '+lotName(l)+' » ?'))return;
    state.lots=state.lots.filter(function(x){return x.id!==id;});
    if(!state.lots.length)state.lots=[{id:state.nextLot++,b:0,rt:{}}];
    sel=null;save();renderMap();renderPanel();
  });
}

/* ============ barrières ============ */
function insertBarrier(i,k){
  var a=state.airs[i],p=0;
  while(p<a.barriers.length&&a.barriers[p]<k)p++;
  var lo=p===0?1:a.barriers[p-1]+1, hi=p===a.barriers.length?DBL_PL-1:a.barriers[p]-1;
  if(lo>hi)return -1;
  k=Math.max(lo,Math.min(hi,k));
  a.barriers.splice(p,0,k);
  a.lots.splice(p+1,0,a.lots[p]);
  return p;
}
function addBarrier(i,j,k){
  var a=state.airs[i];
  var lo=j===0?1:a.barriers[j-1]+1, hi=j===a.barriers.length?DBL_PL-1:a.barriers[j]-1;
  if(lo>hi){alert('Plus de place dans ce morceau.');return;}
  k=Math.max(lo,Math.min(hi,k));
  a.barriers.splice(j,0,k);
  a.lots.splice(j+1,0,a.lots[j]);
  save();
  sel={t:'bar',i:i,p:j};
  renderMap();renderPanel();
}
function moveBarrier(i,p,k){
  var a=state.airs[i];
  var lo=p===0?1:a.barriers[p-1]+1, hi=p===a.barriers.length-1?DBL_PL-1:a.barriers[p+1]-1;
  k=Math.max(lo,Math.min(hi,k));
  if(k===a.barriers[p])return;
  a.barriers[p]=k;save();renderMap();renderPanel();
}
function moveBarrierLive(i,p,k){
  var a=state.airs[i];
  var lo=p===0?1:a.barriers[p-1]+1, hi=p===a.barriers.length-1?DBL_PL-1:a.barriers[p+1]-1;
  k=Math.max(lo,Math.min(hi,k));
  if(k===a.barriers[p])return;
  a.barriers[p]=k;save();renderMap();
}
function delBarrier(i,p){
  var a=state.airs[i];
  a.barriers.splice(p,1);
  a.lots.splice(p,2,a.lots[p]);
  sel=null;save();renderMap();renderPanel();
}
function kFromX(x){return Math.max(1,Math.min(DBL_PL-1,Math.round((x-DBL_X0)/DBL_LEN*DBL_PL)));}

/* ============ interactions carte ============ */
function toSvg(cx,cy){
  var r=svg.getBoundingClientRect();
  return {x:view.x+((cx-r.left)/r.width)*view.w, y:view.y+((cy-r.top)/r.height)*view.h};
}
function aireAt(y){for(var i=0;i<4;i++){if(y>=AIRES[i].y-0.15&&y<=AIRES[i].y+AIRES[i].h+0.15)return i;}return -1;}
function hitBarrier(p){
  var ai=aireAt(p.y);if(ai<0)return null;
  var tol=14/svg.getBoundingClientRect().width*view.w,bp=-1,bd=1e9;
  state.airs[ai].barriers.forEach(function(k,ix){var d=Math.abs(p.x-xOfK(k));if(d<tol&&d<bd){bd=d;bp=ix;}});
  return bp<0?null:{i:ai,p:bp};
}
function segAt(p){
  var ai=aireAt(p.y);
  if(ai<0||p.x<-0.2||p.x>L+0.2)return null;
  if(p.x>DBL_END+0.2)return {i:ai,j:state.airs[ai].lots.length-1};
  var kF=(p.x-DBL_X0)/DBL_LEN*DBL_PL,ks=ksOf(ai);
  for(var j=0;j<ks.length-1;j++)if(kF>=ks[j]-1e-9&&kF<=ks[j+1]+1e-9)return {i:ai,j:j};
  return null;
}
var ptrs={},gest={mode:null,bar:null,moved:0,pc:null,pinch:null,timer:null,longOk:false,pDown:null};
function nPtrs(){return Object.keys(ptrs).length;}
function pinchInfo(){
  var a=[];for(var id in ptrs)a.push(ptrs[id]);
  return {cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,d:Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y))};
}
function clearTimer(){if(gest.timer){clearTimeout(gest.timer);gest.timer=null;}}
svg.addEventListener('contextmenu',function(e){e.preventDefault();});
svg.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{svg.setPointerCapture(e.pointerId);}catch(err){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(nPtrs()===1){
    gest.moved=0;gest.pc={x:e.clientX,y:e.clientY};gest.longOk=false;
    var p=toSvg(e.clientX,e.clientY);gest.pDown=p;
    var bI=hitBarrier(p);
    if(bI){gest.mode='bar';gest.bar=bI;sel={t:'bar',i:bI.i,p:bI.p};renderMap();renderPanel();}
    else{
      gest.mode='pan';
      gest.timer=setTimeout(function(){
        if(gest.mode==='pan'&&gest.moved<10&&nPtrs()===1){
          var sg=segAt(gest.pDown);
          if(sg){
            var p2=insertBarrier(sg.i,kFromX(gest.pDown.x));
            if(p2>=0){save();sel={t:'bar',i:sg.i,p:p2};gest.longOk=true;renderMap();renderPanel();}
          }
        }
      },600);
    }
  }else{
    clearTimer();gest.mode='pinch';gest.bar=null;gest.pinch=pinchInfo();
  }
});
svg.addEventListener('pointermove',function(e){
  if(!(e.pointerId in ptrs))return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(nPtrs()>=2){
    if(gest.mode!=='pinch'){clearTimer();gest.mode='pinch';gest.bar=null;gest.pinch=pinchInfo();return;}
    var pi=pinchInfo();
    if(gest.pinch){
      zoomAt(gest.pinch.cx,gest.pinch.cy,gest.pinch.d/pi.d);
      var r=svg.getBoundingClientRect();
      view.x-=(pi.cx-gest.pinch.cx)/r.width*view.w;
      view.y-=(pi.cy-gest.pinch.cy)/r.height*view.h;
      clampView();setVB();
    }
    gest.pinch=pi;
    return;
  }
  gest.moved=Math.max(gest.moved,Math.abs(e.clientX-gest.pc.x),Math.abs(e.clientY-gest.pc.y));
  if(gest.moved>=10)clearTimer();
  if(gest.mode==='bar'&&gest.bar){
    var p=toSvg(e.clientX,e.clientY);
    moveBarrierLive(gest.bar.i,gest.bar.p,kFromX(p.x));
  }else if(gest.mode==='pan'){
    view.x-=(e.clientX-gest.pc.x)/svg.getBoundingClientRect().width*view.w;
    view.y-=(e.clientY-gest.pc.y)/svg.getBoundingClientRect().height*view.h;
    clampView();setVB();
    gest.pc={x:e.clientX,y:e.clientY};
  }
});
function endPtr(e){
  if(!(e.pointerId in ptrs))return;
  delete ptrs[e.pointerId];
  if(nPtrs()===1){
    clearTimer();
    for(var id in ptrs){gest.pc={x:ptrs[id].x,y:ptrs[id].y};break;}
    gest.mode='pan';gest.bar=null;gest.pinch=null;
    return;
  }
  if(nPtrs()===0){
    clearTimer();
    if(gest.mode==='bar'){renderPanel();}
    else if(gest.mode==='pan'&&!gest.longOk&&gest.moved<10){
      var p=toSvg(e.clientX,e.clientY),bI=hitBarrier(p);
      if(bI)sel={t:'bar',i:bI.i,p:bI.p};
      else{
        var sg=segAt(p);
        sel=sg?{t:'seg',i:sg.i,j:sg.j}:null;
      }
      renderMap();renderPanel();
    }
    gest.mode=null;gest.bar=null;gest.pinch=null;gest.longOk=false;
  }
}
svg.addEventListener('pointerup',endPtr);
svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY>0?1.15:0.87);},{passive:false});

/* ============ boutons ============ */
$('btnReset').addEventListener('click',function(){
  if(confirm('Tout remettre à zéro ? (barrières, lots, brebis, rations)')){
    state=defaultState();sel=null;save();renderMap();renderPanel();
  }
});
$('zin').addEventListener('click',function(){var r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.8);});
$('zout').addEventListener('click',function(){var r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25);});
$('zfit').addEventListener('click',fitView);
var lastAspect=0;
window.addEventListener('resize',function(){
  var r=svg.getBoundingClientRect(),a=r.width/Math.max(1,r.height);
  if(lastAspect&&Math.abs(a/lastAspect-1)>0.25)fitView();
  lastAspect=a;
});

/* ============ départ ============ */
fitView();renderMap();renderPanel();
</script>
</body>
</html>
